# snfoundry.toml - Starknet Foundry configuration
# See: https://foundry-rs.github.io/starknet-foundry/appendix/snfoundry-toml.html

[sncast.default]
account = "deployer"
url = "https://api.cartridge.gg/x/starknet/sepolia/rpc/v0_10"

[sncast.sepolia]
account = "deployer"
url = "https://api.cartridge.gg/x/starknet/sepolia/rpc/v0_10"

[sncast.mainnet]
# `deployer` is an alpha-SEPOLIA account. Naming it here meant a mainnet
# declare failed with "Account = deployer not found under network =
# alpha-mainnet" -- the same wrong-network account bug found in four deploy
# scripts across budokan and budokan-governance.
account = "mainnet-deployer"
url = "https://api.cartridge.gg/x/starknet/mainnet/rpc/v0_10"
